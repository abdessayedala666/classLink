<nav class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="navbar-brand">
      <span class="brand-icon">📚</span>
      <span class="brand-text">ClassLink</span>
    </a>

    <div class="navbar-menu">
      @if (!isLoggedIn) {
        <a routerLink="/auth/login" routerLinkActive="active" class="nav-link">Login</a>
        <a routerLink="/auth/register" routerLinkActive="active" class="nav-link btn-primary">Register</a>
      } @else {
        <div class="user-menu">
          <span class="user-greeting">Hi, welcome {{ user?.name || 'User' }}</span>
          <button (click)="logout()" class="btn-logout">Logout</button>
        </div>
      }
    </div>
  </div>
</nav>
